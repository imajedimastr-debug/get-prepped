<meta http-equiv="refresh" content="3; url=https://get-prepped.github.io/?utm_source=old_link">
<script>
/* Old address (imajedimastr-debug.github.io/get-prepped): forward to the new home and keep the
   tracking tag. Links without a tag are labeled with where they came from, or "old_link". */
(function () {
  var params = new URLSearchParams(window.location.search);
  if (!params.get("utm_source")) {
    var from = "";
    try { from = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) { from = ""; }
    params.set("utm_source", from || "old_link");
  }
  window.location.replace("https://get-prepped.github.io/?" + params.toString() + window.location.hash);
})();
</script>
